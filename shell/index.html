<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essentialis — Web3 Development Platform</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%23000'/><text x='50%25' y='55%25' text-anchor='middle' dominant-baseline='middle' font-family='Inter' font-weight='700' font-size='20' fill='%23D4AF37'>E</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* ─── Tab Bar ─── */
        .tab-bar {
            display: flex;
            align-items: center;
            height: 42px;
            background: #0a0a0a;
            border-bottom: 1px solid #1a1a1a;
            padding: 0 16px;
            gap: 0;
            z-index: 9999;
            position: relative;
        }

        .tab-bar .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-right: 24px;
            user-select: none;
        }

        .tab-bar .brand .logo {
            width: 22px;
            height: 22px;
            background: #D4AF37;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: #000;
        }

        .tab-bar .brand span {
            font-size: 13px;
            font-weight: 600;
            color: #D4AF37;
            letter-spacing: 0.08em;
        }

        .tab {
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 13px;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
            user-select: none;
            gap: 6px;
        }

        .tab:hover {
            color: #aaa;
            background: rgba(255, 255, 255, 0.02);
        }

        .tab.active {
            color: #D4AF37;
            border-bottom-color: #D4AF37;
        }

        .tab .icon {
            font-size: 15px;
            opacity: 0.7;
        }

        .tab.active .icon {
            opacity: 1;
        }

        /* ─── Status dot ─── */
        .tab .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #333;
            margin-left: 4px;
            transition: background 0.3s;
        }

        .tab .status-dot.connected {
            background: #4ade80;
            box-shadow: 0 0 4px #4ade80;
        }

        /* ─── Right side ─── */
        .tab-bar .spacer {
            flex: 1;
        }

        .tab-bar .sync-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            font-size: 12px;
            font-weight: 600;
            color: #000;
            background: #D4AF37;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.02em;
        }

        .tab-bar .sync-btn:hover {
            background: #e6c347;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(212, 175, 55, 0.3);
        }

        .tab-bar .sync-btn:active {
            transform: translateY(0);
        }

        /* ─── Iframe Container ─── */
        .frame-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 42px);
        }

        .frame-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        .frame-container iframe.hidden {
            visibility: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .frame-container iframe.visible {
            visibility: visible;
            pointer-events: auto;
            z-index: 1;
        }

        /* ─── Loading overlay ─── */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 5;
            transition: opacity 0.3s;
        }

        .loading-overlay.loaded {
            opacity: 0;
            pointer-events: none;
        }

        .loading-overlay .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #1a1a1a;
            border-top-color: #D4AF37;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-overlay span {
            margin-top: 12px;
            font-size: 13px;
            color: #666;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <!-- Tab Bar -->
    <div class="tab-bar">
        <div class="brand">
            <div class="logo">E</div>
            <span>ESSENTIALIS</span>
        </div>

        <div class="tab active" id="tab-contracts" onclick="switchTab('contracts')">
            <span class="icon">⟠</span>
            Contracts
            <div class="status-dot connected" id="dot-contracts"></div>
        </div>

        <div class="tab" id="tab-frontend" onclick="switchTab('frontend')">
            <span class="icon">◆</span>
            Frontend
            <div class="status-dot" id="dot-frontend"></div>
        </div>

        <div class="spacer"></div>

        <button class="sync-btn" onclick="handleSync()">
            ☁ Sync to Cloud
        </button>
    </div>

    <!-- Iframe Container -->
    <div class="frame-container">
        <div class="loading-overlay" id="loading-contracts">
            <div class="spinner"></div>
            <span>Loading Contracts IDE...</span>
        </div>
        <div class="loading-overlay" id="loading-frontend">
            <div class="spinner"></div>
            <span>Loading Frontend Builder...</span>
        </div>

        <iframe id="frame-contracts" class="visible" src="http://localhost:8081"
            onload="document.getElementById('loading-contracts').classList.add('loaded'); document.getElementById('dot-contracts').classList.add('connected');"></iframe>

        <iframe id="frame-frontend" class="hidden" src="http://localhost:5174"
            onload="document.getElementById('loading-frontend').classList.add('loaded'); document.getElementById('dot-frontend').classList.add('connected');"></iframe>
    </div>

    <script>
        // Restore active tab from localStorage
        const savedTab = localStorage.getItem('essentialis_active_tab') || 'contracts';
        if (savedTab !== 'contracts') {
            switchTab(savedTab);
        }

        function switchTab(tab) {
            const contractsFrame = document.getElementById('frame-contracts');
            const frontendFrame = document.getElementById('frame-frontend');
            const tabContracts = document.getElementById('tab-contracts');
            const tabFrontend = document.getElementById('tab-frontend');

            if (tab === 'contracts') {
                contractsFrame.className = 'visible';
                frontendFrame.className = 'hidden';
                tabContracts.classList.add('active');
                tabFrontend.classList.remove('active');
            } else {
                contractsFrame.className = 'hidden';
                frontendFrame.className = 'visible';
                tabContracts.classList.remove('active');
                tabFrontend.classList.add('active');
            }

            localStorage.setItem('essentialis_active_tab', tab);
        }

        async function handleSync() {
            const btn = document.querySelector('.sync-btn');
            const origText = btn.innerHTML;
            btn.innerHTML = '⟳ Syncing...';
            btn.disabled = true;
            btn.style.opacity = '0.7';

            try {
                // Trigger sync in the contracts iframe
                const contractsFrame = document.getElementById('frame-contracts');
                contractsFrame.contentWindow.postMessage({ type: 'essentialis_sync' }, '*');

                // For now, just show a toast-like message
                setTimeout(() => {
                    btn.innerHTML = origText;
                    btn.disabled = false;
                    btn.style.opacity = '1';
                }, 2000);
            } catch (err) {
                console.error('Sync error:', err);
                btn.innerHTML = origText;
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        }

        // Listen for cross-frame messages
        window.addEventListener('message', (e) => {
            if (e.data?.type === 'essentialis_sync_complete') {
                const btn = document.querySelector('.sync-btn');
                btn.innerHTML = '✓ Synced!';
                setTimeout(() => { btn.innerHTML = '☁ Sync to Cloud'; }, 2000);
            }
        });
    </script>
</body>

</html>
